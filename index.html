   <head> 
      <title>App6---HTML5-Canvas</title>  
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="apple-mobile-web-app-capable" content="yes">

<script>
var docMod = document.lastModified; // loads last modified time stamp into docMod variable
alert("This file last modified " + docMod); // generates alert box with time stamp. If annoying, comment out this entire line.
console.log("This file last modified " + docMod); // generates message in javaScript console (found in developers tools) with time stamp. 
function drawImage() { // This is the function to add my image
	var canvas = document.getElementById("myCanvas";
	var ctx = canvas.getContext("2d";
	img.onload = function () {
		ctx.drawImage(img, 50, 50, 200, 150); // determines position of image on drawing
	};
	img.src = "https://www.dutchbulbs.com/products/giant-orienpet-liliy-anastasia-89593?srsltid=AfmBOoowHBCpEILLOCu4pFoYoLGcFqPM_W3ooa7rj9EugXknW742GaPE"
}
	function drawRect(){
		var canvas = document.getElementById("myCanvas");
		var ctx = canvas.getContext("2d"); // creates the drawing object
		ctx.fillstyle = "blue";
		ctx.fillRect(50, 50, 150, 100); // determines position of rectangle on canvas

		function drawName() { // adds my name
			var canvas = document.get.ElementById("myCanvas");
			var ctx = canvas.getContext("2d"); // creates the drawing object
			ctx.clearRect(0, 0, canvas.width, canvas.height) // clears everything from the canvas
		}
		
</script>



<style>	
.body {
     margin: 0em;
}
.page {
    width: 100vw;
    height: 100vh;
    position: fixed;
    top: 0;
    left: -100vw;
    overflow-y: auto;
    z-index: 0;
    background-color: hsl(0,0%,100%);
}
  .page:target {
    left: 0vw;
    z-index: 1;
}
</style>

<body>
<div id="header" class="w3-container w3-flat-carrot">
	<h1>App6---HTML5-Canvas</h1>
</div>
	
<div id="content" class="w3-container">
	<p>Content goes here.</p>
		<canvas id="myCanvas" width="300" height="300" style="border:1px solid rgb(130, 35, 35);">

		</canvas>
		<br>

	<button onclick="drawRect()">Draw Rectangle</button> <!-- creates the button "Draw Rectangle"-->
	<button onclick="drawName()">Draw Name</button> <!-- creates the button "Draw Image"-->
	<button onclick="drawImage()">Load Image</button> <!-- creates the button "Load Image"-->
	<button onclick="clearCanvas()">Clear Canvas</button> <!-- creates the button "Clear Canvas"-->
	
<footer class="w3-bottom w3-container w3-flat-carrot">
	<p>DIY!</p>
</footer>

</body>
